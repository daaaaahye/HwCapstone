<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성동안심귀가맵</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #e6f0fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 16px 20px;
  }

  /* 헤더 */
  .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
        }
    .logo {
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 15px; color: #1a56db; white-space: nowrap;
        }
    .a-logo{
            text-decoration: none; color: #1a56db;
        }
    .logo svg { width: 22px; height: 22px; }

  /* 본문 */
  .page-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px 24px;
  }

  /* 카드 */
  .card {
    width: 440px;
    max-width: 100%;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 30px rgba(30,80,200,0.10);
    overflow: hidden;
  }

  /* 카드 상단 파란 영역 */
  .card-top {
    background: linear-gradient(160deg, #1d4ed8 0%, #2563eb 60%, #3b82f6 100%);
    padding: 34px 32px 30px;
    text-align: center;
  }
  .shield-wrap {
    width: 58px; height: 58px;
    background: rgba(255,255,255,0.22);
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .shield-wrap svg { width: 30px; height: 30px; }
  .card-top h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .card-top p  { font-size: 14px; color: rgba(255,255,255,0.85); }

  /* 카드 하단 폼 */
  .card-body { padding: 26px 32px 28px; }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 14px; font-weight: 700; color: #1f2937; margin-bottom: 7px; }

  .input-wrap {
    position: relative; display: flex; align-items: center;
    border: 1.5px solid #e5e7eb; border-radius: 10px; background: #fff;
    transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: #3b82f6; }
  .input-icon {
    position: absolute; left: 14px; color: #9ca3af;
    display: flex; align-items: center; pointer-events: none;
  }
  .input-icon svg { width: 16px; height: 16px; }
  .input-wrap input {
    width: 100%; padding: 13px 44px 13px 42px;
    border: none; outline: none; font-size: 14px;
    color: #111; background: transparent; border-radius: 10px;
  }
  .input-wrap input::placeholder { color: #9ca3af; }
  .toggle-pw {
    position: absolute; right: 12px;
    background: none; border: none; cursor: pointer;
    color: #9ca3af; display: flex; align-items: center; padding: 4px;
  }
  .toggle-pw:hover { color: #6b7280; }
  .toggle-pw svg { width: 17px; height: 17px; }

  .btn-signup {
    width: 100%; padding: 14px;
    background: #2563eb; color: #fff;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-top: 6px;
    transition: background .18s;
  }
  .btn-signup:hover { background: #1d4ed8; }
  .btn-signup:active { transform: scale(.99); }

  .login-link {
    text-align: center; margin-top: 16px;
    font-size: 14px; color: #6b7280;
  }
  .login-link a { color: #2563eb; font-weight: 700; text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }

  /* 카드 아래 이전 페이지로 */
  .back-link {
    margin-top: 18px;
    font-size: 14px;
  }
  .back-link a {
    color: #6b7280; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back-link a:hover { color: #374151; }
  .back-link svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<!-- 헤더 -->
<header class="header">
  <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="150" height="150">
                <path d="M 15 25 L 50 15 L 85 25 V 52 C 85 75 65 90 50 95 C 35 90 15 75 15 52 Z" fill="none" stroke="#1b64b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 50 70 C 60 55 64 49 64 42 C 64 34.3 57.7 28 50 28 C 42.3 28 36 34.3 36 42 C 36 49 40 55 50 70 Z M 50 37 A 5 5 0 1 0 50 47 A 5 5 0 1 0 50 37 Z" fill="#1b64b0" fill-rule="evenodd"/>
            </svg>
        <a href="user_map.html" class="a-logo">성동안심귀가맵</a>
    </div>
</header>

<!-- 본문 -->
<div class="page-body">
  <div class="card">

    <!-- 파란 상단 -->
    <div class="card-top">
      <div class="shield-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <h1>회원가입</h1>
      <p>성동구의 안전을 함께 지켜요</p>
    </div>

    <!-- 폼 -->
    <div class="card-body">
      <form id="signupForm">
      <div class="form-group">
        <label class="form-label">이름 (닉네임)</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input type="text" id="nickname" placeholder="예: 홍길동">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">이메일</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polyline points="2,4 12,13 22,4"/>
            </svg>
          </span>
          <input type="email" id="email" placeholder="예: example@email.com">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="6자 이상 입력해주세요">
          <button class="toggle-pw" onclick="togglePw()" type="button">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-signup">가입하기</button>

      <div class="login-link">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </div>
      </form>
    </div>
  </div>

  <!-- 이전 페이지로 -->
  <div class="back-link">
    <a href="user_map.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      이전 페이지로
    </a>
  </div>
</div>
<script>
let pwVisible = false;
function togglePw() {
  pwVisible = !pwVisible;
  const input = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  input.type = pwVisible ? 'text' : 'password';
  icon.innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    // 프론트 화면에서 입력받은 3가지 데이터를 묶음
    const userData = {
      nickname: document.getElementById('nickname').value,
      email: document.getElementById('email').value,      // 이게 곧 로그인 아이디가 됨
      password: document.getElementById('password').value
      //role:'CITIZEN'
    };

    try {
      const response = await fetch("http://localhost:8000/signup", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
      });

      if (response.ok) {
        alert('회원가입 성공! 로그인 페이지로 이동합니다.');
        window.location.href = '/login.html'; 
      } else {
        const errorData = await response.json();
        alert(`가입 실패: ${errorData.detail}`);
      }
    } catch (err) {
      console.error('서버 통신 에러:', err);
    }
});
</script>
</body>
</html>
