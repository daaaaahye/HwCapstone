<!DOCTYPE html>
<html lang="ko">
<body>
    <h2>마이페이지</h2>
    <p>사용자 정보 표시 영역</p>
    <button onclick="logoutFromMypage()">로그아웃</button>

    <script>
        function logoutFromMypage() {
            localStorage.removeItem('isLoggedIn');
            alert('로그아웃 되었습니다.');
            location.href = 'user_map.html'; // 로그아웃 후 유저 홈으로
        }
    </script>
</body>
</html>
