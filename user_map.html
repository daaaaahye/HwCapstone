<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>성동안심귀가맵 - 유저홈</title>
    <style>
        /* 간단한 사이드 패널 숨김 처리 */
        #side-panel { display: none; width: 300px; border: 1px solid black; position: absolute; right: 0; top: 50px; background: white; height: 100vh;}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; /* 깔끔한 산세리프 폰트 권장 */
        }
        body {
            background-color: #F5F7FA; /* 피그마 느낌의 연한 배경색 (추측) */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between; /* 양 끝으로 밀어내기 */
            align-items: center; /* 세로 중앙 정렬 */
            padding: 15px 30px;
            background-color: #FFFFFF;
            border-bottom: 1px solid #E0E0E0;
        }

        /* 로고 영역 */
        .logo-area {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #1A73E8; /* 파란색 로고 (추측) */
        }

        /* 중앙 검색창 */
        .search-bar {
            width: 400px;
            padding: 10px 15px;
            border: 1px solid #E0E0E0;
            border-radius: 20px;
            background-color: #F8F9FA;
            outline: none;
        }

        /* 우측 버튼 영역 */
        .header-buttons button {
            padding: 8px 16px;
            margin-left: 10px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        
        .btn-login {
            background-color: #FFFFFF;
            color: #333;
            border: 1px solid #CCC !important;
        }
        
        .btn-signup {
            background-color: #1A73E8; /* 파란색 버튼 (추측) */
            color: white;
        }
    </style>
</head>
<body>
    <header id="header">
        <!-- 자바스크립트로 상태에 따라 내용이 바뀔 영역 -->
         <div class="logo-area">
            🛡️ 성동안심귀가맵
        </div>

        <!-- 중앙 검색 -->
        <input type="text" class="search-bar" placeholder="위치 검색... (예: 왕십리역)">

        <!-- 우측 버튼 (JS로 로그인 상태에 따라 변경되게 지난번에 알려준 로직 적용해) -->
        <div class="header-buttons">
            <button class="btn-login">로그인</button>
            <button class="btn-signup">회원가입</button>
        </div>
    </header>

    <main style="flex: 1; position: relative;">
        <!-- 지도 영역 (임시) -->
        <div style="width: 100%; height: 500px; background-color: #eee;">
            지도 영역 무시 (API 연동 필요)
            <!-- 임시 마커 버튼 -->
            <button id="marker-btn" style="position: absolute; top: 200px; left: 200px; color: red;">📍 마커 (클릭해봐)</button>
        </div>

        <button onclick="location.href='report.html'">위험 제보 등록</button>
    </main>

    <!-- 커뮤니티 사이드 패널 -->
    <aside id="side-panel">
        <h3>너무 어두운 골목길 (커뮤니티 상세)</h3>
        <p>가로등이 고장나서 너무 어둡습니다...</p>
        <button onclick="document.getElementById('side-panel').style.display='none'">닫기</button>
    </aside>

    <script>
        // 1. 로그인 상태 확인 후 헤더 변경
        const header = document.getElementById('header');
        const isLoggedIn = localStorage.getItem('isLoggedIn');

        if (isLoggedIn === 'true') {
            header.innerHTML = `
                <span>성동안심귀가맵</span>
                <span onclick="location.href='mypage.html'" style="cursor:pointer; font-weight:bold;">사용자님 (마이페이지로 이동)</span>
                <button onclick="logout()">로그아웃</button>
            `;
        } else {
            header.innerHTML = `
                <span>성동안심귀가맵</span>
                <button onclick="location.href='login.html'">로그인</button>
                <button>회원가입</button>
            `;
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload(); // 페이지 새로고침하여 상태 반영
        }

        // 2. 마커 클릭 시 사이드 패널 열기
        document.getElementById('marker-btn').addEventListener('click', function() {
            document.getElementById('side-panel').style.display = 'block';
        });
    </script>
</body>
</html>
