<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>성동안심귀가맵</title>
    <link rel='stylesheet' href='main.css'>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
        }
        .logo {
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 15px; color: #1a56db; white-space: nowrap;
        }
        .logo svg { width: 22px; height: 22px; }
        .search-wrap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
        }
        .search-wrap input {
            width: 100%;
            padding: 8px 40px 8px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            background: #f9f9f9;
            box-sizing: border-box;
        }
        .search-wrap input:focus { border-color: #1a56db; background: #fff; }
        .search-wrap .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
        }
        .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .btn-login {
            padding: 6px 14px; border: 1px solid #1a56db; border-radius: 6px;
            color: #1a56db; font-size: 13px; cursor: pointer; background: #fff;
        }
        .btn-login:hover { background: #eef2ff; }
        .btn-signup {
            padding: 6px 14px; border: none; border-radius: 6px;
            background: #1a56db; color: #fff; font-size: 13px; cursor: pointer;
        }
        .btn-signup:hover { background: #1447c0; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="150" height="150">
                <path d="M 15 25 L 50 15 L 85 25 V 52 C 85 75 65 90 50 95 C 35 90 15 75 15 52 Z" fill="none" stroke="#1b64b0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
                <path d="M 50 70 C 60 55 64 49 64 42 C 64 34.3 57.7 28 50 28 C 42.3 28 36 34.3 36 42 C 36 49 40 55 50 70 Z M 50 37 A 5 5 0 1 0 50 47 A 5 5 0 1 0 50 37 Z" fill="#1b64b0" fill-rule="evenodd"/>
            </svg>
            성동안심귀가맵
        </div>
        <div class="search-wrap">
            <input type="text" placeholder="위치 검색... (예: 왕십리역)">
            <span class="search-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
        </div>
        <div class="header-right">
            <button class="btn-login">로그인</button>
            <button class="btn-signup">회원가입</button>
        </div>
    </header>

    <!-- 지도를 담을 영역. 크기 지정은 필수야. 지정 안 하면 지도가 안 보여. -->
    <div id="map" style="width: 100%; height: 100vh;"></div>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=783dd155fc3484d1a47feb7eff18969b"></script>
    <script>
        var container = document.getElementById('map'); // 지도를 담을 영역
        var options = { 
            center: new kakao.maps.LatLng(37.55896810579871, 127.0494307885725), // 기본 중심좌표
            level: 3 // 지도의 확대 레벨
        };

        var map = new kakao.maps.Map(container, options); // 지도 생성
    </script>
</body>
</html>
